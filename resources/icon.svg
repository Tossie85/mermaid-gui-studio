<!--
  アクティビティバー用のアイコン。
  フローチャートの部品を組み合わせて Mermaid の頭文字「M」をかたどっている。

  ・M の輪郭そのものがコネクタ（線）
  ・M の左右の頂点＝丸いノード
  ・M の谷＝分岐のひし形

  24px まで小さくしても M の形が残るよう、線でMを描いて頂点に部品を置く構成にしている
  （ノードを大きく置くとMの形が潰れて読めなくなる）。

  VS Code はアイコンを単色で塗り直すので、色は currentColor で形だけを持たせる。
-->
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"
     fill="none" stroke="currentColor" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- M の輪郭：左の縦画 → 谷へ下る → 右上へ上る → 右の縦画 -->
  <path d="M4.5 20.5V6.5l7.5 8.5 7.5-8.5v14"/>
  <!-- 左右の頂点のノード -->
  <circle cx="4.5" cy="5" r="2.2"/>
  <circle cx="19.5" cy="5" r="2.2"/>
  <!-- 谷の分岐（ひし形） -->
  <path d="M12 12.7 14.3 15 12 17.3 9.7 15Z"/>
</svg>
